name: railties_cr
version: 0.1.17
crystal: ">= 1.21.0"
development_dependencies:
  carat:
    github: OrelSokolov/carat.cr
    version: ~> 0.4.0
dependencies:
  attr_reader_cr:
    github: OrelSokolov/attr_reader.cr
    version: ~> 0.1.0
  active_support_cr:
    github: OrelSokolov/active_support.cr
    version: ~> 0.1.0
  action_view_cr:
    github: OrelSokolov/action_view.cr
    version: ~> 0.1.0
  action_pack_cr:
    github: OrelSokolov/action_pack.cr
    version: ~> 0.2.0
  importmap_cr:
    github: OrelSokolov/importmap.cr
    version: ~> 0.1.0
  propshaft_cr:
    github: OrelSokolov/propshaft.cr
    version: ~> 0.1.0
  icr:
    github: OrelSokolov/icr.cr
targets:
  crails:
    main: src/crails_cli.cr

# Контракт поставки carat (OrelSokolov/carat): ключ targets шарды
# игнорируют. GlobalInstaller не запускает shards install — зависимости
# (включая icr) ставятся через prebuild.
binaries:
  crails:
    main: src/crails_cli.cr
    prebuild: shards install
