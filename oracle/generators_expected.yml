scaffold_post:
  steps:
  - argv: rails g scaffold Post title:string body:text published:boolean
    stdout: |2
            invoke  active_record
            create    db/migrate/TS_create_posts.rb
            create    app/models/post.rb
            invoke    test_unit
            create      test/models/post_test.rb
            create      test/fixtures/posts.yml
            invoke  resource_route
             route    resources :posts
            invoke  scaffold_controller
            create    app/controllers/posts_controller.rb
            invoke    erb
            create      app/views/posts
            create      app/views/posts/index.html.erb
            create      app/views/posts/edit.html.erb
            create      app/views/posts/show.html.erb
            create      app/views/posts/new.html.erb
            create      app/views/posts/_form.html.erb
            create      app/views/posts/_post.html.erb
            invoke    resource_route
            invoke    test_unit
            create      test/controllers/posts_controller_test.rb
            invoke    helper
            create      app/helpers/posts_helper.rb
            invoke      test_unit
    stderr: ''
    status: 0
  files:
    app/controllers/posts_controller.rb:
      state: created
      content: |
        class PostsController < ApplicationController
          before_action :set_post, only: %i[ show edit update destroy ]

          # GET /posts
          def index
            @posts = Post.all
          end

          # GET /posts/1
          def show
          end

          # GET /posts/new
          def new
            @post = Post.new
          end

          # GET /posts/1/edit
          def edit
          end

          # POST /posts
          def create
            @post = Post.new(post_params)

            if @post.save
              redirect_to @post, notice: "Post was successfully created."
            else
              render :new, status: :unprocessable_content
            end
          end

          # PATCH/PUT /posts/1
          def update
            if @post.update(post_params)
              redirect_to @post, notice: "Post was successfully updated.", status: :see_other
            else
              render :edit, status: :unprocessable_content
            end
          end

          # DELETE /posts/1
          def destroy
            @post.destroy!
            redirect_to posts_path, notice: "Post was successfully destroyed.", status: :see_other
          end

          private
            # Use callbacks to share common setup or constraints between actions.
            def set_post
              @post = Post.find(params.expect(:id))
            end

            # Only allow a list of trusted parameters through.
            def post_params
              params.expect(post: [ :title, :body, :published ])
            end
        end
    app/helpers/posts_helper.rb:
      state: created
      content: |
        module PostsHelper
        end
    app/models/post.rb:
      state: created
      content: |
        class Post < ApplicationRecord
        end
    app/views/posts/_form.html.erb:
      state: created
      content: |
        <%= form_with(model: post) do |form| %>
          <% if post.errors.any? %>
            <div style="color: red">
              <h2><%= pluralize(post.errors.count, "error") %> prohibited this post from being saved:</h2>

              <ul>
                <% post.errors.each do |error| %>
                  <li><%= error.full_message %></li>
                <% end %>
              </ul>
            </div>
          <% end %>

          <div>
            <%= form.label :title, style: "display: block" %>
            <%= form.text_field :title %>
          </div>

          <div>
            <%= form.label :body, style: "display: block" %>
            <%= form.textarea :body %>
          </div>

          <div>
            <%= form.label :published, style: "display: block" %>
            <%= form.checkbox :published %>
          </div>

          <div>
            <%= form.submit %>
          </div>
        <% end %>
    app/views/posts/_post.html.erb:
      state: created
      content: |
        <div id="<%= dom_id post %>">
          <div>
            <strong>Title:</strong>
            <%= post.title %>
          </div>

          <div>
            <strong>Body:</strong>
            <%= post.body %>
          </div>

          <div>
            <strong>Published:</strong>
            <%= post.published %>
          </div>

        </div>
    app/views/posts/edit.html.erb:
      state: created
      content: |
        <% content_for :title, "Editing post" %>

        <h1>Editing post</h1>

        <%= render "form", post: @post %>

        <br>

        <div>
          <%= link_to "Show this post", @post %> |
          <%= link_to "Back to posts", posts_path %>
        </div>
    app/views/posts/index.html.erb:
      state: created
      content: |
        <p style="color: green"><%= notice %></p>

        <% content_for :title, "Posts" %>

        <h1>Posts</h1>

        <div id="posts">
          <% @posts.each do |post| %>
            <%= render post %>
            <p>
              <%= link_to "Show this post", post %>
            </p>
