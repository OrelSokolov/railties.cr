---
help_generate:
  steps:
  - argv: rails generate
    stdout: |+
      Usage:
        bin/rails generate GENERATOR [args] [options]

      General options:
        -h, [--help]     # Print generator's options and usage
        -p, [--pretend]  # Run but do not make any changes
        -f, [--force]    # Overwrite files that already exist
        -s, [--skip]     # Skip files that already exist
        -q, [--quiet]    # Suppress status output

      Please choose a generator below.

      Rails:
        application_record
        authentication
        benchmark
        channel
        controller
        generator
        helper
        integration_test
        job
        mailbox
        mailer
        migration
        model
        resource
        scaffold
        scaffold_controller
        script
        system_test
        task

      ActiveRecord:
        active_record:application_record
        active_record:multi_db

      SolidCable:
        solid_cable:install
        solid_cable:update

      SolidCache:
        solid_cache:install

      SolidQueue:
        solid_queue:install
        solid_queue:update

      Stimulus:
        stimulus

      TestUnit:
        test_unit:authentication
        test_unit:channel
        test_unit:generator
        test_unit:install
        test_unit:mailbox

    stderr: ''
    status: 0
  files: {}
help_model:
  steps:
  - argv: rails generate model --help
    stdout: |
      Usage:
        bin/rails generate model NAME [field[:type][:index] field[:type][:index]] [options]

      Options:
            [--skip-namespace]                                            # Skip namespace (affects only isolated engines)
                                                                          # Default: false
            [--skip-collision-check]                                      # Skip collision check
                                                                          # Default: false
            [--force-plural], [--no-force-plural], [--skip-force-plural]  # Do not singularize the model name, even if it appears plural
                                                                          # Default: false
        -o, --orm=NAME                                                    # ORM to be invoked
                                                                          # Default: active_record

      ActiveRecord options:
              [--migration], [--no-migration], [--skip-migration]     # Indicates when to generate migration
                                                                      # Default: true
              [--timestamps], [--no-timestamps], [--skip-timestamps]  # Indicates when to generate timestamps
                                                                      # Default: true
              [--parent=PARENT]                                       # The parent class for the generated model
                                                                      # Default: ApplicationRecord
              [--indexes], [--no-indexes], [--skip-indexes]           # Add indexes for references and belongs_to columns
                                                                      # Default: true
              [--primary-key-type=PRIMARY_KEY_TYPE]                   # The type for primary key
        --db, [--database=DATABASE]                                   # The database for your model's migration. By default, the current environment's primary database is used.
        -t,   [--test-framework=NAME]                                 # Test framework to be invoked
                                                                      # Default: test_unit

      TestUnit options:
            [--fixture], [--no-fixture], [--skip-fixture]  # Indicates when to generate fixture
                                                           # Default: true
        -r, [--fixture-replacement=NAME]                   # Fixture replacement to be invoked

      Runtime options:
        -f, [--force]                                      # Overwrite files that already exist
        -p, [--pretend], [--no-pretend], [--skip-pretend]  # Run but do not make any changes
        -q, [--quiet], [--no-quiet], [--skip-quiet]        # Suppress status output
        -s, [--skip], [--no-skip], [--skip-skip]           # Skip files that already exist

      Description:
          Generates a new model. Pass the model name, either CamelCased or
          under_scored, and an optional list of attribute pairs as arguments.

          Attribute pairs are field:type arguments specifying the
          model's attributes. Timestamps are added by default, so you don't have to
          specify them by hand as 'created_at:datetime updated_at:datetime'.

          As a special case, specifying 'password:digest' will generate a
          password_digest field of string type, and configure your generated model and
          tests for use with Active Model has_secure_password (assuming the default ORM
          and test framework are being used).

          You don't have to think up every attribute up front, but it helps to
          sketch out a few so you can start working with the model immediately.

          This generator invokes your configured ORM and test framework, which
          defaults to Active Record and TestUnit.

          Finally, if --parent option is given, it's used as superclass of the
          created model. This allows you create Single Table Inheritance models.

          If you pass a namespaced model name (e.g. admin/account or Admin::Account)
          then the generator will create a module with a table_name_prefix method
          to prefix the model's table name with the module name (e.g. admin_accounts)

      Available field types:

          Just after the field name you can specify a type like text or boolean.
          It will generate the column with the associated SQL type. For instance:

              `bin/rails generate model post title:string body:text`

          will generate a title column with a varchar type and a body column with a text
          type. If no type is specified the string type will be used by default.
          You can use the following types:

              integer
              primary_key
              decimal
              float
              boolean
              binary
              string
              text
              date
              time
              datetime

          You can also consider `references` as a kind of type. For instance, if you run:

              `bin/rails generate model photo title:string album:references`

          It will generate an `album_id` column. You should generate these kinds of fields when
          you will use a `belongs_to` association, for instance. `references` also supports
          polymorphism, you can enable polymorphism like this:

              `bin/rails generate model product supplier:references{polymorphic}`

          For integer, string, text and binary fields, an integer in curly braces will
          be set as the limit:

              `bin/rails generate model user pseudo:string{30}`

          For decimal, two integers separated by a comma in curly braces will be used
          for precision and scale:

              `bin/rails generate model product 'price:decimal{10,2}'`

          You can add a `:uniq` or `:index` suffix for unique or standard indexes
          respectively:

              `bin/rails generate model user pseudo:string:uniq`
              `bin/rails generate model user pseudo:string:index`

          You can combine any single curly brace option with the index options:

              `bin/rails generate model user username:string{30}:uniq`
              `bin/rails generate model product supplier:references{polymorphic}:index`

          If you require a `password_digest` string column for use with
          has_secure_password, you can specify `password:digest`:

              `bin/rails generate model user password:digest`

          If you require a `token` string column for use with
          has_secure_token, you can specify `auth_token:token`:

              `bin/rails generate model user auth_token:token`

      Examples:
          `bin/rails generate model account`

              For Active Record and TestUnit it creates:

                  Model:      app/models/account.rb
                  Test:       test/models/account_test.rb
                  Fixtures:   test/fixtures/accounts.yml
                  Migration:  db/migrate/XXX_create_accounts.rb

          `bin/rails generate model post title:string body:text published:boolean`

              Creates a Post model with a string title, text body, and published flag.

          `bin/rails generate model admin/account`

              For Active Record and TestUnit it creates:

                  Module:     app/models/admin.rb
                  Model:      app/models/admin/account.rb
                  Test:       test/models/admin/account_test.rb
                  Fixtures:   test/fixtures/admin/accounts.yml
                  Migration:  db/migrate/XXX_create_admin_accounts.rb
    stderr: ''
    status: 0
  files: {}
help_migration:
  steps:
  - argv: rails generate migration --help
    stdout: |
      Usage:
        bin/rails generate migration NAME [field[:type][:index] field[:type][:index]] [options]

      Options:
            [--skip-namespace]        # Skip namespace (affects only isolated engines)
                                      # Default: false
            [--skip-collision-check]  # Skip collision check
                                      # Default: false
        -o, --orm=NAME                # ORM to be invoked
                                      # Default: active_record

      ActiveRecord options:
              [--timestamps], [--no-timestamps], [--skip-timestamps]  # Indicates when to generate timestamps
                                                                      # Default: true
              [--primary-key-type=PRIMARY_KEY_TYPE]                   # The type for primary key
        --db, [--database=DATABASE]                                   # The database for your migration. By default, the current environment's primary database is used.

      Runtime options:
        -f, [--force]                                      # Overwrite files that already exist
        -p, [--pretend], [--no-pretend], [--skip-pretend]  # Run but do not make any changes
        -q, [--quiet], [--no-quiet], [--skip-quiet]        # Suppress status output
        -s, [--skip], [--no-skip], [--skip-skip]           # Skip files that already exist

      Description:
          Generates a new database migration. Pass the migration name, either
          CamelCased or under_scored, and an optional list of attribute pairs as arguments.

          A migration class is generated in db/migrate prefixed by a timestamp of the current date and time.

          You can name your migration in either of these formats to generate add/remove
          column lines from supplied attributes: add_{columns}_to_{table} or remove_{columns}_from_{table}.

          A migration name containing JoinTable will generate join tables for use with
          has_and_belongs_to_many associations.

          You can also name your migration create_{table} along with any attributes to generate a regular table.

      Examples:
          `bin/rails generate migration add_ssl_flag`

          If the current date is May 14, 2008 and the current time 09:09:12, this creates the AddSslFlag migration
          db/migrate/TS_add_ssl_flag.rb

          `bin/rails generate migration add_title_body_published_to_post title:string body:text published:boolean`

          This will create db/migrate/TS_add_title_body_published_to_post.rb with this in the migration:

            add_column :posts, :title, :string
            add_column :posts, :body, :text
            add_column :posts, :published, :boolean

          `bin/rails generate migration create_media_join_table artists musics:uniq`

          This will create a join table migration:

          create_join_table :artists, :musics do |t|
            # t.index [:artist_id, :music_id]
            t.index [:music_id, :artist_id], unique: true
          end

          `bin/rails generate migration create_users email:string`

          This will create the migration:

          create_table :users do |t|
            t.string :email
            t.timestamps
          end
    stderr: ''
    status: 0
  files: {}
help_scaffold:
  steps:
  - argv: rails generate scaffold --help
    stdout: |
      Usage:
        bin/rails generate scaffold NAME [field[:type][:index] field[:type][:index]] [options]

      Options:
            [--skip-namespace]                                                  # Skip namespace (affects only isolated engines)
                                                                                # Default: false
            [--skip-collision-check]                                            # Skip collision check
                                                                                # Default: false
            [--force-plural], [--no-force-plural], [--skip-force-plural]        # Do not singularize the model name, even if it appears plural
                                                                                # Default: false
        -o, --orm=NAME                                                          # ORM to be invoked
                                                                                # Default: active_record
            [--model-name=MODEL_NAME]                                           # ModelName to be used
            [--resource-route], [--no-resource-route], [--skip-resource-route]  # Indicates when to generate resource route
                                                                                # Default: true
            [--api], [--no-api], [--skip-api]                                   # Generate API-only controller and tests, with no view templates
                                                                                # Default: false
        -c, --scaffold-controller=NAME                                          # Scaffold controller to be invoked
                                                                                # Default: scaffold_controller

      ActiveRecord options:
              [--migration], [--no-migration], [--skip-migration]     # Indicates when to generate migration
                                                                      # Default: true
              [--timestamps], [--no-timestamps], [--skip-timestamps]  # Indicates when to generate timestamps
                                                                      # Default: true
              [--parent=PARENT]                                       # The parent class for the generated model
                                                                      # Default: ApplicationRecord
              [--indexes], [--no-indexes], [--skip-indexes]           # Add indexes for references and belongs_to columns
                                                                      # Default: true
              [--primary-key-type=PRIMARY_KEY_TYPE]                   # The type for primary key
        --db, [--database=DATABASE]                                   # The database for your model's migration. By default, the current environment's primary database is used.
        -t,   [--test-framework=NAME]                                 # Test framework to be invoked
                                                                      # Default: test_unit

      TestUnit options:
            [--fixture], [--no-fixture], [--skip-fixture]  # Indicates when to generate fixture
                                                           # Default: true
        -r, [--fixture-replacement=NAME]                   # Fixture replacement to be invoked
            [--system-tests=SYSTEM_TESTS]                  # Generate system test files (set to 'true' to enable)

      ScaffoldController options:
            [--helper], [--no-helper], [--skip-helper]  # Indicates when to generate helper
                                                        # Default: true
            [--skip-routes]                             # Don't add routes to config/routes.rb.
        -e, [--template-engine=NAME]                    # Template engine to be invoked
                                                        # Default: erb

      Runtime options:
        -f, [--force]                                      # Overwrite files that already exist
        -p, [--pretend], [--no-pretend], [--skip-pretend]  # Run but do not make any changes
        -q, [--quiet], [--no-quiet], [--skip-quiet]        # Suppress status output
        -s, [--skip], [--no-skip], [--skip-skip]           # Skip files that already exist

      Description:
          Scaffolds an entire resource, from model and migration to controller and
          views, along with a full test suite. The resource is ready to use as a
          starting point for your RESTful, resource-oriented application.

          Pass the name of the model (in singular form), either CamelCased or
          under_scored, as the first argument, and an optional list of attribute
          pairs.

          Attributes are field arguments specifying the model's attributes. You can
          optionally pass the type and an index to each field. For instance:
          'title body:text tracking_id:integer:uniq' will generate a title field of
          string type, a body with text type and a tracking_id as an integer with an
          unique index. "index" could also be given instead of "uniq" if one desires
          a non unique index.

          As a special case, specifying 'password:digest' will generate a
          password_digest field of string type, and configure your generated model,
          controller, views, and test suite for use with Active Model
          has_secure_password (assuming they are using Rails defaults).

          Timestamps are added by default, so you don't have to specify them by hand
          as 'created_at:datetime updated_at:datetime'.

          You don't have to think up every attribute up front, but it helps to
          sketch out a few so you can start working with the resource immediately.

          For example, 'scaffold post title body:text published:boolean' gives
          you a model with those three attributes, a controller that handles
          the create/show/update/destroy, forms to create and edit your posts, and
          an index that lists them all, as well as a resources :posts declaration
          in config/routes.rb.

          If you want to remove all the generated files, run
          'bin/rails destroy scaffold ModelName'.

      Examples:
          `bin/rails generate scaffold post`
          `bin/rails generate scaffold post title:string body:text published:boolean`
          `bin/rails generate scaffold purchase amount:decimal tracking_id:integer:uniq`
          `bin/rails generate scaffold user email:uniq password:digest`
    stderr: ''
    status: 0
  files: {}
